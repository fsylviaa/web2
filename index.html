<style>
  :root {
    --font-heading: 'HelveticaNowDisplay-Medium', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    --font-body: 'HelveticaNowDisplayW01-Rg', 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: #382a33; /* 与图片背景的灰调藕粉一致，加载时不会闪白 */
    color: #fff;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }

  /* ---------- 背景：视频（有就用）/ 图片（占位） ---------- */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 70% center;
  }
  #bgImg {
    transform: scale(1.04);
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
    will-change: transform;
  }
  /* 手机端：人物靠右显示，底部加一层渐暗，让文字更清楚 */
  @media (max-width: 767px) {
    .bg { object-position: 80% 20%; }
    .shade {
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: linear-gradient(to top, rgba(56,42,51,.85) 0%, rgba(56,42,51,.55) 35%, rgba(56,42,51,0) 60%);
    }
  }
  #bgCanvas {
    display: none;
    transform-origin: 70% 40%;
    will-change: transform;
  }
  body.has-frames #bgCanvas { display: block; }
  body.has-frames #bgImg { display: none; }

  /* ---------- 导航 ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
  }
  .logo { display: flex; align-items: center; gap: 12px; }
  .logo-text { font-family: var(--font-heading); font-size: 21px; letter-spacing: -0.025em; }
  .logo-star { font-size: 25px; letter-spacing: -0.02em; user-select: none; }
  .links, .cta { display: none; }
  .links { font-size: 20px; align-items: baseline; }
  .links a, .cta { transition: opacity .2s; }
  .links a:hover, .cta:hover { opacity: .6; }
  .links small, .cta small, .m-links small { font-size: .55em; opacity: .75; margin-left: .3em; letter-spacing: .02em; }
  .cta { font-size: 20px; text-decoration: underline; text-underline-offset: 4px; }

  .burger {
    display: flex; flex-direction: column; gap: 5px;
    background: none; border: 0; padding: 6px; position: relative; z-index: 11;
  }
  .burger span { display: block; width: 24px; height: 2px; background: #fff; transition: all .3s; }
  body.menu-open .burger span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  body.menu-open .burger span:nth-child(2) { opacity: 0; }
  body.menu-open .burger span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .overlay {
    position: fixed; inset: 0; z-index: 9;
    background: rgba(0,0,0,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 0 32px;
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  body.menu-open .overlay { opacity: 1; pointer-events: auto; }
  .m-links a { font-size: 32px; font-weight: 500; }
  .m-links .u { text-decoration: underline; text-underline-offset: 5px; }

  @media (min-width: 640px) {
    .nav { padding: 20px 32px; }
    .logo-text { font-size: 26px; }
    .logo-star { font-size: 30px; }
  }
  @media (min-width: 768px) {
    .links { display: flex; }
    .cta { display: inline; }
    .burger, .overlay { display: none; }
  }
  @media (min-width: 1100px) {
    .links, .cta { font-size: 23px; }
  }

  /* ---------- 首屏文字 ---------- */
  .hero {
    position: relative; z-index: 1;
    height: 100vh; height: 100svh;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 0 20px 48px; overflow: hidden;
  }
  @media (min-width: 640px) { .hero { padding-left: 32px; padding-right: 32px; } }
  @media (min-width: 768px) { .hero { justify-content: center; padding: 0 40px; } }

  .content { max-width: 36rem; position: relative; z-index: 10; }

  .intro {
    pointer-events: none; user-select: none;
    margin-bottom: 20px;
    font-size: clamp(18px, 4vw, 26px); line-height: 1.3;
    filter: blur(4px);
  }
  .intro .en { display: block; font-size: .62em; margin-top: .3em; opacity: .9; }

  .type { margin-bottom: 20px; min-height: 54px; }
  .type .zh { white-space: pre-line; font-size: clamp(18px, 4vw, 26px); line-height: 1.35; }
  .type .en { display: block; margin-top: .45em; font-size: clamp(13px, 2.2vw, 16px); line-height: 1.45; opacity: .85; min-height: 1.45em; }
  .cursor {
    display: inline-block; width: 2px; height: 1.1em; background: #fff;
    vertical-align: middle; margin-left: 2px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  @media (min-width: 640px) { .intro, .type { margin-bottom: 24px; } }

  .pills {
    display: flex; flex-wrap: wrap; row-gap: 4px;
    opacity: 0; transform: translateY(8px);
    transition: opacity .4s ease, transform .4s ease;
  }
  .pills.show { opacity: 1; transform: none; }
  .pill {
    display: inline-flex; align-items: center; justify-content: center; gap: .45em;
    border-radius: 999px; font-size: 13px; line-height: 1.5;
    padding: .3em 16px; margin: 0 .2em .4em; white-space: nowrap;
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .pill small { font-size: .82em; opacity: .55; }
  .pill-solid { background: #fff; color: #000; border: 1px solid rgba(0,0,0,.1); }
  .pill-solid:hover { background: #000; color: #fff; }
  .pill.tag:hover { background: #fff; color: #000; }   /* 个人标签只是展示，不会变色 */
  .pill-line { background: transparent; color: #fff; border: 1px solid #fff; gap: 8px; }
  .pill-line:hover { background: #fff; color: #000; }
  .pill-line u { text-underline-offset: 2px; }
  .pill-line svg { width: 12px; height: 12px; flex: none; }
  @media (min-width: 640px) {
    .pill { font-size: 15px; padding-left: 20px; padding-right: 20px; }
    .pill-line { gap: 12px; }
  }


  /* ---------- 毛毡小蛋糕鼠标（只在有鼠标的设备上） ---------- */
  .cake-cursor {
    position: fixed; left: 0; top: 0; z-index: 1000;
    width: 112px; height: 112px;
    background: url(cake.png) no-repeat center / contain;
    pointer-events: none; display: none;
    transform-origin: 11px 11px;
    will-change: transform;
  }
  /* 小蛋糕的荧光拖尾（画在一张透明画布上，位于蛋糕下面） */
  .cake-trail {
    position: fixed; inset: 0; z-index: 999;
    width: 100%; height: 100%;
    pointer-events: none; display: none;
  }
  @media (hover: hover) and (pointer: fine) {
    html, body, a, button { cursor: none; }
    .cake-cursor.on { display: block; }
    .cake-trail { display: block; }
  }

  @media (prefers-reduced-motion: reduce) {
    #bgImg { transition: none; }
    .cursor { animation: none; }
    .cake-trail { display: none !important; }
  }
</style>

<script>
(function () {
  /* ---------- 1. 文案（想改字，只改这里） ---------- */
  var TEXT_ZH = '很高兴你来了。懂行的人总会找到这里。\n那么，我们一起做点什么？';
  var TEXT_EN = "Glad you stopped in. Good taste tends to find its way here. So, what are we building?";
  var EMAIL   = 'silviafsy01@gmail.com';

  /* ---------- 2. 打字机：先中文，再英文 ---------- */
  function typewriter(el, text, speed, delay, onDone) {
    var i = 0;
    setTimeout(function () {
      var t = setInterval(function () {
        i++;
        el.textContent = text.slice(0, i);
        if (i >= text.length) { clearInterval(t); onDone && onDone(); }
      }, speed);
    }, delay);
  }
  var cZh = document.getElementById('cursorZh');
  var cEn = document.getElementById('cursorEn');
  typewriter(document.getElementById('typeZh'), TEXT_ZH, 70, 600, function () {
    cZh.style.display = 'none';
    cEn.style.display = 'inline-block';
    typewriter(document.getElementById('typeEn'), TEXT_EN, 28, 200, function () {
      cEn.style.display = 'none';
    });
  });

  /* ---------- 3. 按钮 400ms 后出现（不等打字结束） ---------- */
  setTimeout(function () { document.getElementById('pills').classList.add('show'); }, 400);

  /* ---------- 4. 复制邮箱 ---------- */
  var copyBtn = document.getElementById('copyBtn');
  var copyLabel = document.getElementById('copyLabel');
  var original = copyLabel.innerHTML;
  copyBtn.addEventListener('click', function () {
    var done = function () {
      copyLabel.textContent = '已复制 Copied ✓';
      setTimeout(function () { copyLabel.innerHTML = original; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(EMAIL).then(done, function () { location.href = 'mailto:' + EMAIL; });
    } else {
      location.href = 'mailto:' + EMAIL;
    }
  });

  /* ---------- 5. 手机菜单 ---------- */
  document.getElementById('burger').addEventListener('click', function () {
    document.body.classList.toggle('menu-open');
  });
  document.querySelectorAll('#overlay a').forEach(function (a) {
    a.addEventListener('click', function () { document.body.classList.remove('menu-open'); });
  });

  /* ---------- 6. 背景：会跟着鼠标看的玩偶 ----------
     用到的素材：
       frames/   60 张抠好背景的玩偶图（眼珠从左边慢慢移到右边）
       bg-lotus.jpg    干净的灰调藕粉背景
     效果：
       · 鼠标在哪，她的眼珠就看向哪：在她左边看左、在她脸前正视你、在她右边看右
       · 鼠标上下 → 头部微微抬起 / 低下
       · 人物和背景反向错开，产生立体感
       · 鼠标不动时也在轻轻呼吸 */
  var FRAME_COUNT = 60;          // frames 文件夹里图片的数量
  var FW = 1112, FH = 760;       // 每张图片的尺寸
  var NECK_Y = 395;              // 脖子在图片里的高度（这条线以上算"头"）
  var NECK_FEATHER = 70;         // 头和身体之间的过渡带
  var NOD = 5;                   // 点头幅度（像素）：调小了，让眼睛当主角
  var BG_SHIFT = 26, FIG_SHIFT = 12;  // 背景 / 人物的错位幅度

  var canvas = document.getElementById('bgCanvas');
  var ctx = canvas.getContext('2d');
  var img = document.getElementById('bgImg');
  var frames = new Array(FRAME_COUNT);
  var bgPlate = new Image();
  var ready = false, bgReady = false, midReady = false;

  // 状态：gaze = 现在显示第几张；mx/my = 鼠标位置（-0.5 ~ 0.5）
  var mid = 26;   // 先加载正视你的那张
  var CENTER = 26;              // 正视你的那一张（第 27 张）
  var gazeTarget = CENTER, gaze = CENTER, gazeV = 0;
  var FACE_X = 878;            // 她的脸在图片里的横向位置
  var faceScreenX = window.innerWidth * 0.7;
  var mxT = 0, myT = 0, mx = 0, my = 0, mxV = 0, myV = 0;

  function checkReady() {
    if (!ready && bgReady && midReady) {
      ready = true;
      document.body.classList.add('has-frames');
      resize();
    }
  }
  bgPlate.onload = function () { bgReady = true; checkReady(); };
  bgPlate.src = 'bg-lotus.jpg';

  function pad(n) { return ('00' + n).slice(-3); }
  function load(i) {
    var im = new Image();
    im.decoding = 'async';
    im.onload = function () {
      frames[i] = im;
      if (i === mid) { midReady = true; checkReady(); }
    };
    im.src = 'frames/f' + pad(i + 1) + '.webp';
  }
  load(mid);   // 先加载中间那张，再往两边加载
  for (var k = 1; k <= mid + 1; k++) {
    if (mid - k >= 0) load(mid - k);
    if (mid + k < FRAME_COUNT) load(mid + k);
  }
  function nearestLoaded(i) {
    for (var d = 0; d < FRAME_COUNT; d++) {
      if (frames[i - d]) return frames[i - d];
      if (frames[i + d]) return frames[i + d];
    }
    return null;
  }

  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr);
    canvas.height = Math.round(window.innerHeight * dpr);
  }
  window.addEventListener('resize', resize);

  // 画人物：脖子以上整体上下挪动，过渡带里平滑拉伸，所以不会有断层
  function drawFigure(f, x, y, s, nod) {
    var STEP = 4;
    var top = NECK_Y + NECK_FEATHER;
    function disp(sy) {
      if (sy <= NECK_Y) return nod;
      if (sy >= top) return 0;
      var t = (sy - NECK_Y) / NECK_FEATHER;
      return nod * (1 - t * t * (3 - 2 * t));   // 平滑过渡
    }
    for (var sy = 0; sy < top; sy += STEP) {
      var sy2 = Math.min(sy + STEP, top);
      var dy1 = sy + disp(sy), dy2 = sy2 + disp(sy2);
      ctx.drawImage(f, 0, sy, FW, sy2 - sy, x, y + dy1 * s, FW * s, (dy2 - dy1) * s + 0.6);
    }
    ctx.drawImage(f, 0, top, FW, FH - top, x, y + top * s, FW * s, (FH - top) * s);
  }

  function render(time) {
    var f = nearestLoaded(Math.round(gaze));
    if (!f) return;
    var cw = canvas.width, ch = canvas.height;
    var s = Math.max(cw / FW, ch / FH) * 1.1;
    var mobile = window.innerWidth < 768;
    var px = mobile ? 0.8 : 0.7, py = mobile ? 0.2 : 0.5;
    var ox = (cw - FW * s) * px, oy = (ch - FH * s) * py;

    // 背景（往鼠标反方向挪）
    var bw = bgPlate.naturalWidth * s, bh = bgPlate.naturalHeight * s;
    var bx = ox + (FW * s - bw) / 2 - mx * BG_SHIFT * dpr;
    var by = oy + (FH * s - bh) / 2 - my * BG_SHIFT * 0.6 * dpr;
    ctx.fillStyle = '#382a33';
    ctx.fillRect(0, 0, cw, ch);
    ctx.drawImage(bgPlate, bx, by, bw, bh);

    // 呼吸：很轻的起伏
    var breath = Math.sin(time / 1000 * 1.25);
    var bs = 1 + breath * 0.0045;
    var fs = s * bs;
    var fx = ox + (FW * s - FW * fs) * 0.5 + mx * FIG_SHIFT * dpr;
    var fy = oy + (FH * s - FH * fs) + my * FIG_SHIFT * 0.6 * dpr;   // 以脚下为支点

    faceScreenX = (fx + FACE_X * fs) / dpr;
    drawFigure(f, fx, fy, fs, my * NOD * 2);
  }

  function loop(time) {
    // 转头：弹簧跟随（追上后会有一点点回弹）
    gazeV += (gazeTarget - gaze) * 0.07;
    gazeV *= 0.78;
    gaze = Math.max(0, Math.min(FRAME_COUNT - 1, gaze + gazeV));
    // 位置：同样的弹簧，更柔一些
    mxV += (mxT - mx) * 0.05; mxV *= 0.82; mx += mxV;
    myV += (myT - my) * 0.05; myV *= 0.82; my += myV;
    if (ready) render(time || 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  function aim(x, y) {
    var nx = Math.max(0, Math.min(1, x / window.innerWidth));
    // 以她的脸为中心：鼠标在脸的左边 → 往左看，右边 → 往右看，越远看得越偏
    var W = window.innerWidth;
    if (x < faceScreenX) {
      var l = Math.max(0, Math.min(1, (faceScreenX - x) / Math.max(1, faceScreenX - 30)));
      gazeTarget = CENTER * (1 - l);
    } else {
      var r = Math.max(0, Math.min(1, (x - faceScreenX) / Math.max(1, (W - 20) - faceScreenX)));
      gazeTarget = CENTER + (FRAME_COUNT - 1 - CENTER) * r;
    }
    mxT = nx - 0.5;
    if (y !== null) myT = Math.max(0, Math.min(1, y / window.innerHeight)) - 0.5;
  }

  window.addEventListener('mousemove', function (e) {
    aim(e.clientX, e.clientY);
    if (!ready) {   // 素材还没加载好时，先用静态图轻微跟随
      var x = (e.clientX / window.innerWidth - 0.5);
      var y = (e.clientY / window.innerHeight - 0.5);
      img.style.transform = 'scale(1.06) translate(' + (-x * 18) + 'px,' + (-y * 10) + 'px)';
    }
  });
  // 手机：手指在屏幕上滑动，玩偶跟着看过去
  window.addEventListener('touchmove', function (e) { aim(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
  window.addEventListener('touchstart', function (e) { aim(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

  /* ---------- 7. 毛毡小蛋糕鼠标 ----------
     蛋糕的尖角就是鼠标的"箭头尖"。移动时会跟着速度轻轻摇摆，
     指到按钮上会放大一点，点击时会被"捏"一下。 */
  var cake = document.getElementById('cake');
  var HOT = 11;                      // 尖角离图片左上角的距离（像素）
  var cx = -100, cy = -100, lastX = null, swing = 0, swingV = 0;
  var hover = false, press = false, sc = 1;
  window.addEventListener('mousemove', function (e) {
    cake.classList.add('on');
    addTrail(e.clientX, e.clientY);
    if (lastX !== null) swingV += (e.clientX - lastX) * 0.6;
    lastX = e.clientX; cx = e.clientX; cy = e.clientY;
    var t = e.target;
    hover = !!(t && t.closest && t.closest('a, button'));
  });
  document.addEventListener('mouseleave', function () { cake.classList.remove('on'); lastX = null; trailLast = null; });
  window.addEventListener('mousedown', function (e) { press = true; burst(e.clientX, e.clientY); });
  window.addEventListener('mouseup', function () { press = false; });

  /* ---------- 8. 小蛋糕的荧光拖尾 ----------
     鼠标移动时，从蛋糕身后撒出一串发光的小光团，像彗星尾巴一样慢慢变淡、变小。
     颜色从奶油粉渐变到蜂蜜金，和蛋糕本身的颜色呼应。点击时会"噗"地撒出一小圈星星。 */
  var trail = document.getElementById('trail');
  var tctx = trail.getContext('2d');
  var parts = [], trailLast = null, tdpr = 1;
  var TRAIL_OFFSET_X = 40, TRAIL_OFFSET_Y = 38;   // 拖尾从蛋糕中间冒出来，而不是从尖角
  var TRAIL_LIFE = 34;                             // 每颗光团活多少帧（越大拖尾越长）
  function sizeTrail() {
    tdpr = Math.min(window.devicePixelRatio || 1, 2);
    trail.width = Math.round(window.innerWidth * tdpr);
    trail.height = Math.round(window.innerHeight * tdpr);
  }
  sizeTrail(); window.addEventListener('resize', sizeTrail);
  function addTrail(x, y) {
    var px = x + TRAIL_OFFSET_X, py = y + TRAIL_OFFSET_Y;
    if (trailLast) {
      var dx = px - trailLast.x, dy = py - trailLast.y, dist = Math.sqrt(dx * dx + dy * dy);
      var steps = Math.min(12, Math.floor(dist / 6));          // 移动得快也不会断开
      for (var k = 1; k <= steps; k++) {
        var t = k / (steps + 1);
        parts.push({ x: trailLast.x + dx * t, y: trailLast.y + dy * t, r: 9 + Math.random() * 4, life: TRAIL_LIFE, max: TRAIL_LIFE, hue: (performance.now() / 18) % 360, vx: 0, vy: 0, star: false });
      }
    }
    parts.push({ x: px, y: py, r: 10 + Math.random() * 4, life: TRAIL_LIFE, max: TRAIL_LIFE, hue: (performance.now() / 18) % 360, vx: 0, vy: 0, star: false });
    if (Math.random() < 0.35) {   // 偶尔飘出一颗小星星
      parts.push({ x: px + (Math.random() - .5) * 18, y: py + (Math.random() - .5) * 18, r: 2 + Math.random() * 2, life: 50, max: 50, vx: (Math.random() - .5) * .6, vy: .3 + Math.random() * .5, star: true });
    }
    trailLast = { x: px, y: py };
    if (parts.length > 500) parts.splice(0, parts.length - 500);
  }
  function burst(x, y) {
    for (var k = 0; k < 14; k++) {
      var a = Math.PI * 2 * k / 14, sp = 1.6 + Math.random() * 1.6;
      parts.push({ x: x + TRAIL_OFFSET_X * .5, y: y + TRAIL_OFFSET_Y * .5, r: 2.5 + Math.random() * 2, life: 40, max: 40, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, star: true });
    }
  }
  // 粉 → 金 两种颜色之间过渡
  function trailColor(t, alpha) {
    var r = 255, g = Math.round(150 + 70 * t), b = Math.round(200 - 110 * t);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }
  (function trailLoop() {
    tctx.setTransform(tdpr, 0, 0, tdpr, 0, 0);
    tctx.clearRect(0, 0, trail.width, trail.height);
    tctx.globalCompositeOperation = 'lighter';
    for (var i = parts.length - 1; i >= 0; i--) {
      var q = parts[i];
      q.life--; if (q.life <= 0) { parts.splice(i, 1); continue; }
      q.x += q.vx; q.y += q.vy; q.vx *= .96; q.vy *= .96;
      var f = q.life / q.max;                 // 1 → 0
      if (q.star) {
        var rs = q.r * (0.6 + 0.4 * f);
        tctx.fillStyle = 'rgba(255,248,220,' + (0.9 * f) + ')';
        tctx.shadowColor = 'rgba(255,230,150,' + f + ')'; tctx.shadowBlur = 8;
        tctx.beginPath();                      // 小小的四角星
        tctx.moveTo(q.x, q.y - rs * 2); tctx.quadraticCurveTo(q.x, q.y, q.x + rs * 2, q.y);
        tctx.quadraticCurveTo(q.x, q.y, q.x, q.y + rs * 2); tctx.quadraticCurveTo(q.x, q.y, q.x - rs * 2, q.y);
        tctx.quadraticCurveTo(q.x, q.y, q.x, q.y - rs * 2); tctx.fill();
      } else {
        var r = q.r * (0.35 + 0.65 * f);
        var g = tctx.createRadialGradient(q.x, q.y, 0, q.x, q.y, r * 2.2);
        g.addColorStop(0, trailColor(1 - f, 0.75 * f));
        g.addColorStop(0.35, trailColor(1 - f, 0.36 * f));
        g.addColorStop(1, trailColor(1 - f, 0));
        tctx.shadowBlur = 0;
        tctx.fillStyle = g;
        tctx.beginPath(); tctx.arc(q.x, q.y, r * 2.2, 0, Math.PI * 2); tctx.fill();
      }
    }
    tctx.shadowBlur = 0;
    requestAnimationFrame(trailLoop);
  })();

  (function cakeLoop() {
    swingV += -swing * 0.12; swingV *= 0.78; swing += swingV;
    swing = Math.max(-25, Math.min(25, swing));
    var target = press ? 0.86 : (hover ? 1.22 : 1);
    sc += (target - sc) * 0.25;
    var rot = swing + (hover ? -10 : 0);
    cake.style.transform = 'translate(' + (cx - HOT) + 'px,' + (cy - HOT) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
    requestAnimationFrame(cakeLoop);
  })();
})();
</script>
</body>
